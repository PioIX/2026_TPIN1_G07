<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preguntados</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Style/style2.css">
</head>
<body>
  <div class="bg-questions" id="bgQ"></div>

  <div class="card">
    <div class="title">
      <h1>Preguntados</h1>
    </div>

    <div class="tabs">
      <button class="tab active">Iniciar Sesion</button>
    </div>

  <div id="login-form">
      <p class="subtitle">¡Bienvenido de vuelta!</p>

      <div class="form-group">
        <label class="form-label">Correo Electrónico:</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input id="ingreseMail" type="email" class="form-input" placeholder="Ej: nombre@gmail.com"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña:</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input id="ingreseContraseña" type="password" class="form-input" placeholder="Tu contraseña"/>
        </div>
      </div>

      <button onclick="tomarDatosSesion()" class="btn-main">¡Jugar!</button>

      <p class="footer-link">¿No tenes cuenta? <a href="indexRegistro.html">Registrate</a></p>
  </div>
  </div>

<script>

    function switchTab(tab, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
    }

  const container = document.getElementById('bgQ');



</script>




<script src="index.js"></script>
<script src="dom.js"></script>



</body>
</html>
