
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style/style3.css">

</head>

<body>

    <div class="contenedor-principal">

        <div class="ruleta-wrapper">

            <div class="ruleta-flecha"></div>

            <div class="ruleta-borde">

                <div class="ruleta-disco" id="ruleta">

                    <img src="Style/HISTORIA-.png" alt="HISTORIA" class="icono i1">

                    <img src="Style/DEPORTES-.png" alt="DEPORTE" class="icono i2">

                    <img src="Style/CINE-.png" alt="CINE" class="icono i3">

                    <img src="Style/BONUS-.png" alt="BONUS" class="icono i4">

                    <img src="Style/CIENCIA-.png" alt="Ciencia" class="icono i5">
                    
                    <img src="Style/GEOGRAFIA-.png" alt="Geografía" class="icono i6">
                </div>

            </div>

        </div>

        <div class="zona-boton">

            <img src="Style/Personaje Pr Rosa.png" alt="Personaje" class="personaje">

            <button class="btn-pulsar" id="btnGirar" onclick="girarRuleta()">
                PULSA AQUÍ
            </button>
            <button class="btn-reiniciar" id="btn-reiniciar" onclick="reiniciarPartida()">Reiniciar Ruleta e Historial</button>
        </div>

    </div>

    <script>
        let gradosActuales = 0;
        const ruleta = document.getElementById("ruleta");
        const boton = document.getElementById("btnGirar");
        
        // Nombres normalizados
        const todasLasCategorias = ["Geografia", "Ciencia", "Bonus", "Arte", "Deporte", "Historia"];

        // Compara todo en minúsculas de forma segura
        function verificarCategoriaNoDisponible(categoriaGanadora){
            let terminadas = JSON.parse(localStorage.getItem("categoriasTerminadas")) || [];
            let bloqueadas = JSON.parse(localStorage.getItem("categoriasBloqueadas")) || [];

            let terminadasMin = terminadas.map(c => c.toLowerCase());
            let bloqueadasMin = bloqueadas.map(c => c.toLowerCase());
            let ganadoraMin = categoriaGanadora.toLowerCase();

            return terminadasMin.includes(ganadoraMin) || bloqueadasMin.includes(ganadoraMin);
        }

        function girarRuleta() {
            boton.disabled = true;

            const vueltas = Math.floor(Math.random() * 5) + 5;
            const gradosExtra = Math.floor(Math.random() * 360);
            
            gradosActuales += (vueltas * 360) + gradosExtra;
            ruleta.style.transform = `rotate(${gradosActuales}deg)`;
        }

        ruleta.addEventListener('transitionend', () => {
            boton.disabled = false;

            let anguloFinal = gradosActuales % 360;
            let categoriaGanadora = "";

            if (anguloFinal >= 0 && anguloFinal < 60) {
                categoriaGanadora = "Geografia";
            } else if (anguloFinal >= 60 && anguloFinal < 120) {
                categoriaGanadora = "Ciencia";
            } else if (anguloFinal >= 120 && anguloFinal < 180) {
                categoriaGanadora = "Bonus";
            } else if (anguloFinal >= 180 && anguloFinal < 240) {
                categoriaGanadora = "Arte"; // Cambiar por "Cine" si tu archivo es cine.html
            } else if (anguloFinal >= 240 && anguloFinal < 300) {
                categoriaGanadora = "Deporte";
            } else if (anguloFinal >= 300 && anguloFinal < 360) {
                categoriaGanadora = "Historia";
            }
            
            console.log("Resultado matemático de detención: " + anguloFinal + "°");
            
            let terminadas = JSON.parse(localStorage.getItem("categoriasTerminadas")) || [];
            let bloqueadas = JSON.parse(localStorage.getItem("categoriasBloqueadas")) || [];
            
            let todasLasJugadas = [...new Set([
                ...terminadas.map(c => c.toLowerCase()), 
                ...bloqueadas.map(c => c.toLowerCase())
            ])];

            if(todasLasJugadas.length >= todasLasCategorias.length){
                alert("¡Felicidades! Ya jugaste todas las categorías posibles.");
                window.location.href = "puntos.html";
                return;
            }

            // --- CORRECCIÓN CRUCIAL CON EL RETURN ---
            if(verificarCategoriaNoDisponible(categoriaGanadora)){
                console.log("Categoría no disponible: " + categoriaGanadora + ". Re-girando...");
                girarRuleta(); 
                return; //  Evita que continúe y muestre el confirm de abajo
            }
            
            localStorage.setItem("categoria_actual", categoriaGanadora);
            
            if(confirm("¡Te tocó: " + categoriaGanadora + "!")){
                window.location.href = categoriaGanadora.toLowerCase() + ".html";
            }
        });

        async function reiniciarPartida() {
            let confirmar = confirm("¿Estás seguro de que quieres borrar tu progreso de categorías y REINICIAR TU PUNTUACIÓN a cero?");
            
            if (confirmar) {
                const idUsuario = localStorage.getItem("ID_usuario");

                if (idUsuario) {
                    try {
                        await fetch('http://localhost:4000/reiniciarPuntuacionBD', {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({ id_usuario: idUsuario })
                        });
                    } catch (error) {
                        console.error("Error al conectar con el servidor:", error);
                    }
                }

                localStorage.setItem("categoriasTerminadas", JSON.stringify([]));
                localStorage.setItem("categoriasBloqueadas", JSON.stringify([]));
                localStorage.removeItem("preguntas_respondidas");
                localStorage.removeItem("categoria_actual");
                localStorage.removeItem("preguntas");
                
                alert("¡Historial y puntuación reiniciados con éxito!");
                window.location.reload(); 
            }
        }
    </script>

</body>
</html>
