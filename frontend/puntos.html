<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Puntos</title>

    <link rel="stylesheet" href="Style/puntos.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="ranking-container">

        <img src="Style/images-removebg-preview.png" alt="Logo" class="logo">

        <div class="title-box">
            <h1>TABLA DE PUNTOS</h1>
        </div>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>N° Partida</th>
                        <th>Jugador</th>
                        <th>Preguntas Totales</th>
                        <th>Aciertos</th>
                        <th>Puntaje Máximo</th>
                    </tr>
                </thead>

                <tbody id="cuerpo-tabla">
                    </tbody>
            </table>

        </div>

    </div>

    <script>
        window.onload = function() {
            cargarTablaPuntos();
        };

        async function cargarTablaPuntos() {
            try {
                
                const respuesta = await fetch('http://localhost:4000/Partida');
                const partidas = await respuesta.json();

                const cuerpoTabla = document.getElementById("cuerpo-tabla");
                cuerpoTabla.innerHTML = ""; 

                
                const colores = ["pink", "green", "yellow", "blue"];

                // Recorremos los datos que vinieron de la base de datos
                partidas.forEach((partida, index) => {
                    
                    const claseColor = colores[index % colores.length];

                    // Creamos la fila con todas las columnas 
                    const fila = document.createElement("tr");
                    fila.innerHTML = `
                        <td class="${claseColor}">${partida.id_partida}</td>
                        <td class="${claseColor}">${partida.nombre}</td>
                        <td class="${claseColor}">${partida.preguntas_totales}</td>
                        <td class="${claseColor}">${partida.aciertos}</td>
                        <td class="${claseColor}">${partida.puntaje_maximo}</td>
                    `;

                    // Insertamos la fila en el cuerpo de la tabla
                    cuerpoTabla.appendChild(fila);
                });

            } catch (error) {
                console.error("Error al cargar los datos de la tabla:", error);
            }
        }
    </script>
</body>
</html>
