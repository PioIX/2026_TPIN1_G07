<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Puntos</title>

    <link rel="stylesheet" href="Style/puntos.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
      <div class="ranking-container">

        <!-- Logo -->
        <img src="Style/images-removebg-preview.png" alt="Logo" class="logo">

        <!-- Título -->
        <div class="title-box">
            <h1>TABLA DE PUNTOS</h1>
        </div>

        <!-- Tabla -->
        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Jugador</th>
                        <th>Cantidad de Partidas</th>
                        <th>Puntaje Total</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td class="pink">nombre</td>
                        <td class="pink">9</td>
                        <td class="pink">250</td>
                    </tr>

                    <tr>
                        <td class="green">nombre</td>
                        <td class="green">5</td>
                        <td class="green">100</td>
                    </tr>

                    <tr>
                        <td class="yellow">nombre</td>
                        <td class="yellow">15</td>
                        <td class="yellow">525</td>
                    </tr>

                    <tr>
                        <td class="blue">nombre</td>
                        <td class="blue">4</td>
                        <td class="blue">84</td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>
</body>
</html>
