<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <title>APP Web</title>
        <link rel="stylesheet" href="Style/styleAdim.css">

    <body onload="llenarTabla()">
        <style> table, th, td{
        border: 1px solid black;
        }</style>

        <h1>Tabla Preguntas Para Modificar </h1>

    <table style="width: 100%;">
        <tr>
            <th>Categoria</th>
            <th>Texto Pregunta</th>
            <th>ID</th>
        </tr>
        <tbody id="tabla-contenido">

        </tbody>
    </table>

        <h1 id="BaseDatos"> Baso de Datos </h1>
        <button onclick="GetPreguntas()">Llamado Al Backend</button>

        <h2>Agregar una pregunta nueva</h2>
        <input id="ingresoCategorias" placeholder="ingrese Categoria">
        <input id="ingresoTextoPregunta" placeholder="ingrese Texto Pregunta">
        <button onclick="DatosPregunta()">Enviar al POST</button>

        <h2>Eliminar Pregunta</h2>
        <label for="selector-datos">Selecciona un elemento:</label>
        <select id="selector-datos">
            <option value="">Seleccione Dato</option>
        </select>

        <button onclick="borrarDatos()">Eliminar de la base de datos</button>


        <h2>Cambiar una pregunta</h2>
        <label for="selector-datos2">Selecciona un elemento:</label>
        <select id="selector-datos2">
            <option value="">Seleccione Dato</option>
        </select>

        <input type="text" id="botonInputCategorias" placeholder="Escribe CATEGORIA ha cambiar...">
        <input type="text" id="botonInputTextoregunta" placeholder="Escribe TEXTO DE PREGUNTA ha cambiar...">
        <button onclick="cambiarDato()">Enviar</button>
