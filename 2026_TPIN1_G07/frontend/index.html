<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preguntados</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-questions" id="bgQ"></div>

  <h1 class="title">PREGUNTADOS</h1>

  <a href="index2.html">
    <button class="btn-start"> COMENZAR </button>
  </a>

  <div class="bottom-scene">
    <div class="arch"></div>
    <div class="arch"></div>
    <div class="arch"></div>
    <div class="arch"></div>
    <div class="arch"></div>
  </div>

  <script>
    const container = document.getElementById('bgQ');

    

    marks.forEach(p => {
      const span = document.createElement('span');
      span.textContent = '?';
      span.style.top = p.t;
      span.style.left = p.l;
      span.style.fontSize = p.s;
      span.style.transform = `rotate(${p.r})`;
      span.style.opacity = p.o;
      container.appendChild(span);
    });
  </script>
</body>
</html>
